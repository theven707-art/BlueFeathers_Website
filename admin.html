<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Blue Feathers Sports Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="enhancements.css">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <style>
        .admin-header {
            background: linear-gradient(135deg, rgba(21, 101, 255, 0.2) 0%, rgba(21, 101, 255, 0.08) 100%);
            border-bottom: 1px solid rgba(21, 101, 255, 0.3);
            color: #E8EEFF;
            padding: 2rem 0;
            margin-bottom: 2rem;
            margin-top: 72px;
        }

        .admin-header h1 {
            color: #E8EEFF;
        }

        .admin-header p {
            color: #8896B3;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-header {
            margin-top: 4rem;
        }

        .section-header h2 {
            color: #E8EEFF;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: #8896B3;
            font-size: 0.95rem;
        }

        .section-header code {
            background: rgba(21, 101, 255, 0.15);
            color: #7CB9FF;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Login overlay */
        .admin-login-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(5, 9, 26, 0.97);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 60px rgba(21, 101, 255, 0.2);
            transition: transform 0.1s;
        }

        .login-box h2 {
            color: #E8EEFF;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .login-box>p {
            color: #8896B3;
            margin-bottom: 1.5rem;
        }

        .login-input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1rem;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #E8EEFF;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .login-input:focus {
            border-color: #1565FF;
            outline: none;
            box-shadow: 0 0 0 3px rgba(21, 101, 255, 0.2);
            background: rgba(21, 101, 255, 0.08);
        }

        /* Booking cards */
        .booking-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #F5C842;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            backdrop-filter: blur(8px);
            transition: border-color 0.3s;
        }

        .booking-card:hover {
            border-left-color: #1565FF;
        }

        .booking-info h4 {
            color: #E8EEFF;
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
        }

        .booking-info p {
            color: #8896B3;
            margin: 0.25rem 0;
            font-size: 0.9rem;
        }

        .booking-info strong {
            color: #C8D4FF;
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-approve {
            background: rgba(0, 229, 160, 0.12);
            color: #00E5A0;
            border: 1.5px solid rgba(0, 229, 160, 0.35);
            padding: 0.55rem 1.4rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            font-family: inherit;
